name: Deploy Resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm install

      - name: Build resume
        run: npm run build -- --base=/https://github.com/liu-hongrui/resume.git/

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
